[project]
name = "genia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=3.2.0",
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[project.scripts]
genia = "genia:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
